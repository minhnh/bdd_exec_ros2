/bdd_test/test_coordinator:
  ros__parameters:
    topic_observation_adapters: "bdd_exec_ros2.executables.mockup_behaviour_node:TOPIC_OBSERVATION_ADAPTERS"
    event_topic: "/bdd_test/events"
    use_sim_time: False
/bdd_test/mockup_behaviour:
  ros__parameters:
    event_topic: "/bdd_test/events"
    use_sim_time: False
    loop_duration: 0.01       # duration in seconds for step events
    heartbeat_duration: 0.04  # duration in seconds for callback
    simulate_collision: false
    delay_lower: 0.1          # lower range of duration for each state
    delay_upper: 0.15         # upper range of duration for each state
