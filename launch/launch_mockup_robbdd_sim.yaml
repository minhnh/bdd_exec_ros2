%YAML 1.2
---
launch:
  - arg:
      name: "ns"
      default: "bdd"
  - arg:
      name: "config"
      default: "$(find-pkg-share bdd_exec_ros2)/config/mockup_configs.yaml"
  - arg:
      name: "graph_models"
      default: "$(find-pkg-share bdd_exec_ros2)/models/pickplace-models-robbdd-sim.yaml"
  - arg:
      name: "simulation_service_namespace"
      default: "/"
  - arg:
      name: "world_entity_name"
      default: "world"
  - arg:
      name: "simulate_collision"
      default: "false"
  - node:
      pkg: "bdd_exec_ros2"
      exec: "bdd_coordination_node"
      namespace: "$(var ns)"
      name: "test_coordinator"
      param:
        - from: "$(var config)"
        - name: "graph_models"
          value: "$(var graph_models)"
        - name: "scene_setup_mode"
          value: "simulation"
        - name: "simulation_service_namespace"
          value: "$(var simulation_service_namespace)"
        - name: "world_entity_name"
          value: "$(var world_entity_name)"
  - node:
      pkg: "bdd_exec_ros2"
      exec: "mockup_behaviour_node"
      namespace: "$(var ns)"
      name: "mockup_behaviour"
      param:
        - from: "$(var config)"
        - name: "simulate_collision"
          value: "$(var simulate_collision)"
